<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7ed957">
<title>All 바르게</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
window.PI_SESSION=null;
var PI_READY=(async function(){try{if(window.Pi)await Pi.init({version:"2.0"})}catch(e){}})();
window.piLogin=async function(){
  if(window.PI_SESSION)return window.PI_SESSION;
  try{await PI_READY;if(!window.Pi)return null;
    var a=await Pi.authenticate(["username","payments"],function(p){try{fetch("/pay/incomplete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:p.identifier,txid:p.transaction&&p.transaction.txid})})}catch(e){}});if(!a||!a.accessToken)return null;
    var un=a.user&&a.user.username,uid=a.user&&a.user.uid;
    try{var r=await fetch("/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:a.accessToken})});if(r.ok){var d=await r.json();if(d&&d.ok){un=d.username;uid=d.uid}}}catch(e){}
    window.PI_SESSION={token:a.accessToken,uid:uid,username:un};return window.PI_SESSION}catch(e){return null}};
</script>
<style>
:root{--g:#5cc93a;--g2:#e7f9dd;--y:#ffcf33;--y2:#fff6d4;--s:#4db8f5;--s2:#e3f4ff;--p:#ff7fa8;--p2:#ffe6ee;--ink:#2e3a2a;--mut:#7d8a76;--bg:#fffcf2;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.gstage{position:relative;height:300px;border-radius:var(--r);overflow:hidden;margin-bottom:14px;box-shadow:0 3px 0 rgba(0,0,0,.05)}
.gground{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(#8fe36d,#5cc93a);border-radius:50% 50% 0 0/30px 30px 0 0}
.gground.pot:after{content:"";position:absolute;left:50%;top:-6px;width:120px;height:54px;margin-left:-60px;background:linear-gradient(#e8925a,#c96b35);border-radius:8px 8px 30px 30px;box-shadow:inset 0 8px 0 #f0a877}
.gpet{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);line-height:1;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.08))}
.ghat{position:absolute;left:50%;top:-.55em;transform:translateX(-50%) rotate(-8deg)}.grib{position:absolute;right:-.2em;top:.1em}
.ga{position:absolute;font-size:40px}.ga.rb{top:6px;left:10px;font-size:70px;opacity:.85}.ga.hs{right:14px;bottom:40px;font-size:60px}.ga.bf{left:22%;top:70px;animation:drift 3s ease-in-out infinite alternate}
.ga.sp1{left:24%;top:40%;font-size:26px;animation:tw 1.6s infinite}.ga.sp2{right:24%;top:30%;font-size:22px;animation:tw 2s .5s infinite}.ga.sp3{right:32%;top:62%;font-size:20px;animation:tw 1.8s .9s infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.7)}}
.gfx{position:absolute;left:50%;top:40%;font-size:52px;transform:translateX(-50%);animation:fxup .9s ease-out forwards}@keyframes fxup{to{transform:translate(-50%,-70px);opacity:0}}
.gsay{position:absolute;left:10px;right:10px;top:10px;background:rgba(255,255,255,.92);border-radius:14px;padding:8px 12px;font-size:13.5px;font-weight:800;text-align:center}
.gcare{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.gcare button{background:#fff;border:2px solid #eef2ea;border-radius:16px;padding:10px 4px;font-weight:800;font-size:13px;color:var(--ink)}
.gcare span{display:block;font-size:30px}.gcare i,.gshop i{display:block;font-style:normal;font-size:11.5px;color:var(--mut);margin-top:2px}.gcare .dn{background:var(--g2);border-color:#c9f0b6}
.gcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.gcal i{font-style:normal;text-align:center;font-size:12.5px;padding:6px 0;border-radius:10px;background:#f6f8f3;color:#8a9585;font-weight:700;min-height:28px}.gcal i:empty{background:none}.gcal i.on{background:var(--y2);font-size:15px}.gcal i.td{outline:2px solid var(--g)}
.gshop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gshop>*{background:#fff;border:2px solid #eef2ea;border-radius:16px;padding:10px 4px;font-weight:800;font-size:12.5px;color:var(--ink);text-align:center}
.gshop span{display:block;font-size:30px}.gshop .on{background:var(--g2);border-color:var(--g)}.gshop .own{background:#fafbf8}
.gpay{background:linear-gradient(160deg,#f4edff,#fff)}.gpay .gshop{grid-template-columns:repeat(2,1fr)}.gpay i{color:#7b4bd8!important;font-weight:900;font-size:13px!important}
.cv-skip{display:block;margin-top:12px;color:#7d8a76;font-weight:700;font-size:13.5px;text-decoration:underline}
.ic-cap{position:relative;display:inline-block}.ic-cap b{position:absolute;left:50%;top:-.5em;transform:translateX(-44%) rotate(-10deg);font-size:.62em;font-weight:400;line-height:1}
.icrow{display:flex;align-items:center;gap:8px}.icrow .ic{margin:0}.icsay{background:#fff;border-radius:14px;padding:6px 12px;font-weight:800;font-size:14px;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.06);position:relative}.icsay:before{content:'';position:absolute;left:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-right-color:#fff;border-left:0}
.gmap{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gmap>div{position:relative;background:#f6f8f3;border-radius:14px;padding:8px 2px 6px;text-align:center;opacity:.55}.gmap>div span{display:block;line-height:1.2;height:34px;display:flex;align-items:center;justify-content:center}.gmap b{display:block;font-size:12px}.gmap i{display:block;font-style:normal;font-size:11px;color:var(--mut)}.gmap .done{opacity:1;background:var(--g2)}.gmap .cur{opacity:1;background:var(--y2);outline:2px solid var(--y)}.gmap em{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#ff7fa8;color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:8px;padding:1px 6px;white-space:nowrap}
.gcat{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:14px 0 8px;font-size:16px}.gcat:first-child{margin-top:0}.gbuy{margin-left:auto;background:#7b4bd8;color:#fff;border:0;border-radius:12px;padding:5px 10px;font-size:11.5px;font-weight:800}.gp em.fr{background:var(--g)}
.gstage.sky .gsay,.gstage.sea .gsay{background:rgba(255,255,255,.9)}.gstage.sky:after{content:'✦ · ✧ · ✦ · ✧';position:absolute;left:0;right:0;top:62px;text-align:center;color:#fff6;letter-spacing:22px;font-size:14px}.gstage.sky .gpet,.gstage.sea .gpet{bottom:70px}
.gfr{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:4px}.gfr button{flex:0 0 auto;min-width:78px;background:#fff;border:2px solid #eef2ea;border-radius:16px;padding:8px 6px;text-align:center;color:var(--ink)}.gfr button.on{border-color:var(--g);background:var(--g2)}.gfr span{display:block;font-size:32px;line-height:1.1}.gfr b{display:block;font-size:12.5px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gfr i{font-style:normal;font-size:11px;color:var(--mut)}.gfr .add{border-style:dashed}
.gcard{display:block!important;text-align:left}.gcard .wl{display:block}.gcfr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.gcfr div{background:#fff9;border-radius:14px;padding:6px 8px;text-align:center;min-width:58px}.gcfr span{display:block;font-size:34px;line-height:1.1}.gcfr i{font-style:normal;font-size:11px;font-weight:700;color:#556;display:block;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard{display:flex!important;align-items:center;gap:12px;padding:14px!important;text-align:left}.gl{flex:0 0 42%}.gtile{position:relative;width:72px;height:72px;background:#fffb;border-radius:18px;display:grid;place-items:center;margin-top:8px;box-shadow:0 2px 0 rgba(0,0,0,.05)}.gtile span{font-size:40px;line-height:1}.gtile i{position:absolute;right:-6px;bottom:-6px;background:var(--g);color:#fff;font-style:normal;font-weight:800;font-size:12px;border-radius:10px;padding:2px 7px}.gtile em{position:absolute;left:-6px;top:-10px;background:#ff7fa8;color:#fff;font-style:normal;font-weight:800;font-size:10.5px;border-radius:10px;padding:2px 7px;white-space:nowrap}.gl h3{margin:10px 0 2px!important}.gl p{margin:0}.gr{flex:1;min-width:0}.gch{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gch span{background:#fff;border-radius:12px;padding:5px 2px;text-align:center;font-size:11.5px;font-weight:800;color:#3d4a37;box-shadow:0 2px 0 rgba(0,0,0,.05);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gch b{display:block;font-size:20px;line-height:1.2}.gearth{margin:10px 0 0!important;font-size:12px!important;font-weight:800;color:#3a8f20!important;line-height:1.4}
.seal{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:46px;margin:-3px 0;border:2.5px solid #e8364b;border-radius:50%;color:#e8364b;transform:rotate(-14deg);background:#fff8;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3px #e8364b55}.seal b{font-size:10.5px;font-weight:900;line-height:1.15;letter-spacing:-.5px;white-space:nowrap}
.mx{display:flex;gap:8px;margin-top:8px;align-items:center}.mx .inp{flex:1;margin:0;padding:12px;font-size:14px}.mx .chip{flex:0 0 84px;padding:10px 6px;font-weight:800;text-align:center}
.card .ic{height:50px;display:flex;align-items:center}
</style>

'Friendship':['{N} and {F} played happily all day. But then they argued about who would ride the swing first.','"Me first!" "No, me first!" Their faces turned red, and they turned their backs on each other.','Sitting alone, {N}\'s heart felt achy. Swinging alone wasn\'t any fun at all.','{N} bravely walked over to {F}. "I\'m sorry about before. Let\'s take turns." {F} nodded. "I\'m sorry too."','They pushed each other on the swing. Every time they flew up high, giggles filled the air.','{N} kept it close in heart: "I\'m sorry" and "thank you" are magic words that bring friends back together.'],
'Sharing':['{N} took a yummy strawberry cookie out of the bag. But {F} was looking at it with a hungry face.','{N} thought for a moment — there were only two cookies. "Hmm… one is for you!"','{F}\'s eyes went round, and then came a big smile. "Thank you! Then I\'ll share half my apple with you."','Shared, the cookie and the apple tasted twice as good. Squirrels and birds gathered too, and a little picnic began.','When everyone shared a little, every tummy was full and every heart felt warmer.','{N} learned that sharing doesn\'t make things smaller — it makes joy bigger.'],
'Tidying up':['{F} came to play in {N}\'s room. But toys and books were scattered everywhere.','"Huh? Where did my blue block go?" {N} searched and searched but couldn\'t find it.','{F} said, "Let\'s play the tidy-up game! We find a home for every toy!"','Dolls to the basket house, books to the shelf house, blocks to the box house! They sang as they tidied, one by one.','When they finished, the blue block popped out from under the bed: "Here I am!" The room felt big and fresh.','{N} promised, "After playing, I\'ll help my toys find their homes!" The toys seemed to sparkle with joy.'],
'Healthy teeth':['After a yummy dinner, sleepy {N} said, "I\'ll skip brushing tonight and just go to bed…"','Just then {F} appeared with a tiny magnifying glass. "{V}, the cavity bugs are about to throw a party in your teeth!"','Through the glass, little bugs cheered, "Yum yum, no brushing tonight!" {N} was shocked.','{N} grabbed a toothbrush and brushed up and down, inside and out — scrub, scrub! The bugs ran away screaming.','Teeth sparkled white in the mirror. {F} gave a big thumbs-up. "Awesome! You\'re a strong-teeth knight!"','That night, {N} slept sweetly with a fresh mouth. Brushing every night is a great promise to keep your body safe.'],
'Bedtime':['It was late at night, but {N} couldn\'t fall asleep. The moon peeked in through the window.','Then {F} came with a soft cloud blanket. "{V}, want to go stargazing?"','They floated up into the sky on the cloud blanket. One by one, the stars twinkled hello.','The stars asked {N} to share one good thing from the day. {N} told them about helping a friend.','The stars clapped, and sparkly dust drifted down and gently closed {N}\'s eyes.','Soon {N} was fast asleep under a cozy blanket. {F} whispered, "Good night. See you tomorrow."']
},
ST_END:['From that day on, {N} and {F} were the very best of friends. Tonight in dreams, they\'ll hold hands and play in {P} again. The End.','As the sky turned sunset-gold, {F} waved. "{V}, today was so much fun. Let\'s play again!" {N} came home with a warm heart. The End.','{N} happily told Mom and Dad all about the day. Mom and Dad gave {N} the biggest hug. The End.'],

 privacy:['Pi로 로그인하면 아이 이름(애칭)과 도장·키우기·퀴즈 기록이 보호자의 Pi 계정에 연결돼 안전하게 저장돼요. 폰을 바꿔도 이어서 쓸 수 있어요. 로그인하지 않으면 이 기기에만 저장돼요.','그림 사진과 아이 프로필 사진은 이 기기 안에만 있고, 서버나 다른 곳으로 절대 보내지 않아요.','광고, 추적 도구, 외부 분석 도구를 쓰지 않아요.','브라우저의 사이트 데이터를 지우면 앱 기록이 모두 지워져요.','Pi 결제는 보호자(Pi 계정 주인)만 할 수 있고, Pi 사용자 이름과 결제 정보는 Pi Network 규칙에 따라 처리해요. 기록을 지우고 싶으면 앱 안 문의로 알려 주세요.'],

en:{cover:'Kids app · With parents · No ads',about:'Kondaengi and Konsuni are old-soul twins who always say “Back in my day~”. They nag a lot, but they care about your child more than anyone — and teach good habits through praise stamps, name stories, 4-panel comics, drawing quizzes and manners quizzes.',

 terms:['This is a learning-and-play app for children aged 3–8, used together with a guardian.','Please supervise your child while using the app.','Drawing scores and stories are just for fun, not an evaluation of your child.','The Kondaengi and Konsuni characters and app content belong to the developer. Certificates and drawing cards may be freely saved and printed at home.','The app may be improved over time. If paid features are added, prices are shown before payment.'],

vi:{cover:'Ứng dụng cho bé · Cùng bố mẹ · Không quảng cáo',about:'Kondaengi và Konsuni là cặp song sinh “ông cụ non” lúc nào cũng nói “Thời của ta~”. Hay cằn nhằn nhưng thương bé hơn ai hết — hai bạn dạy thói quen tốt qua bảng dấu khen, truyện mang tên bé, truyện tranh 4 khung, đố vẽ tranh và đố phép lịch sự.',
 privacy:['Khi đăng nhập Pi, biệt danh của bé và dữ liệu dấu khen, nuôi bạn, đố vui được liên kết với tài khoản Pi của người giám hộ và lưu an toàn, đổi điện thoại vẫn dùng tiếp được. Không đăng nhập thì mọi thứ chỉ lưu trên thiết bị này.','Ảnh tranh vẽ và ảnh đại diện của bé chỉ nằm trên thiết bị này, không bao giờ gửi lên máy chủ hay nơi khác.','Không quảng cáo, không công cụ theo dõi, không phân tích bên thứ ba.','Xóa dữ liệu trang web trong trình duyệt sẽ xóa toàn bộ dữ liệu ứng dụng.','Chỉ người giám hộ (chủ tài khoản Pi) mới thanh toán Pi. Tên người dùng Pi và thông tin thanh toán được xử lý theo quy định của Pi Network. Muốn xóa dữ liệu, hãy liên hệ qua trang ứng dụng.'],
 terms:['Đây là ứng dụng học và chơi cho trẻ 3–8 tuổi, dùng cùng người giám hộ.','Bố mẹ vui lòng cùng theo dõi khi bé sử dụng.','Điểm tranh và truyện chỉ để vui, không phải đánh giá bé.','Nhân vật Kondaengi, Konsuni và nội dung ứng dụng thuộc về nhà phát triển. Giấy khen và thẻ tranh được tự do lưu, in tại nhà.','Ứng dụng có thể được cải tiến. Nếu có tính năng trả phí, giá sẽ được báo trước khi thanh toán.'],

id:{cover:'Aplikasi anak · Bersama orang tua · Tanpa iklan',about:'Kondaengi dan Konsuni adalah si kembar berjiwa tua yang selalu bilang “Zamanku dulu~”. Suka mengomel, tapi paling sayang anak — mereka mengajarkan kebiasaan baik lewat stempel pujian, dongeng nama, komik 4 panel, kuis menggambar dan kuis sopan santun.',
 privacy:['Jika login dengan Pi, nama panggilan anak serta catatan stempel, merawat teman dan kuis terhubung ke akun Pi wali dan disimpan dengan aman, jadi bisa dilanjutkan di ponsel baru. Tanpa login, semuanya hanya tersimpan di perangkat ini.','Foto gambar dan foto profil anak hanya ada di perangkat ini dan tidak pernah dikirim ke server atau ke mana pun.','Tanpa iklan, tanpa pelacak, tanpa analitik pihak ketiga.','Menghapus data situs di browser akan menghapus semua catatan aplikasi.','Hanya wali (pemilik akun Pi) yang bisa membayar dengan Pi. Nama pengguna Pi dan info pembayaran diproses sesuai aturan Pi Network. Untuk menghapus data, hubungi kami lewat halaman aplikasi.'],

hi:{cover:'बच्चों का ऐप · माता-पिता के साथ · कोई विज्ञापन नहीं',about:'कोनदेंगी और कोनसूनी बड़ों जैसी बातें करने वाले जुड़वाँ हैं, जो हमेशा कहते हैं “हमारे ज़माने में~”। टोकते बहुत हैं, पर बच्चे को सबसे ज़्यादा प्यार करते हैं — शाबाशी स्टैम्प, नाम वाली कहानी, 4-पैनल कॉमिक, ड्रॉइंग क्विज़ और शिष्टाचार क्विज़ से अच्छी आदतें सिखाते हैं।',

 terms:['यह 3–8 वर्ष के बच्चों के लिए अभिभावक के साथ इस्तेमाल होने वाला सीखने-खेलने का ऐप है।','कृपया बच्चे के इस्तेमाल पर नज़र रखें।','ड्रॉइंग स्कोर और कहानियाँ सिर्फ़ मज़े के लिए हैं, बच्चे का मूल्यांकन नहीं।','कोनदेंगी, कोनसूनी किरदार और ऐप सामग्री डेवलपर की है। प्रमाणपत्र और ड्रॉइंग कार्ड घर पर स्वतंत्र रूप से सेव और प्रिंट किए जा सकते हैं।','ऐप में सुधार हो सकते हैं। सशुल्क सुविधा आने पर भुगतान से पहले कीमत बताई जाएगी।'],

zh:{cover:'儿童应用 · 亲子共用 · 无广告',about:'小唠叨和小叨叨是一对总把「我们那时候~」挂在嘴边的小大人双胞胎。虽然爱唠叨,却比谁都疼爱孩子——通过表扬印章、名字童话、四格漫画、画画挑战和礼仪问答,陪孩子养成好习惯。',

var LNAME={ko:'한국어',en:'English',ja:'日本語',zh:'中文',vi:'Tiếng Việt',id:'Bahasa Indonesia',hi:'हिन्दी',es:'Español',fr:'Français',de:'Deutsch',pt:'Português',it:'Italiano',tr:'Türkçe',ru:'Русский',th:'ไทย',ar:'العربية',el:'Ελληνικά'};
var LANGS={ko:'한국어'};Object.keys(LNAME).forEach(function(k){if(window.TR&&TR[k]&&window.CT&&CT[k])LANGS[k]=LNAME[k]});
var LANG=(function(){var q='';try{q=new URLSearchParams(location.search).get('lang')||''}catch(e){}var s=ls('lang');var n=(navigator.language||'').slice(0,2);
  if(LANGS[q])return q;if(LANGS[s])return s;return n==='ko'?'ko':(LANGS[n]?n:'en')})();
document.documentElement.lang=LANG;
function josa(s){if(LANG!=='ko')return s;return s.replace(/(\S)\[([^\]\/]+)\/([^\]]+)\]/g,function(m,ch,a,b){var j=jong(ch);if(a==='으로')return ch+((j>0&&j!==8)?a:b);return ch+(j>0?a:b)})}
function t(k){var a=arguments,d=LANG!=='ko'&&window.TR&&TR[LANG],s=d&&(k in d)?d[k]:k;return josa(s.replace(/\{(\d)\}/g,function(m,i){return a[+i+1]}))}

/* ---------- 한국어 조사 ---------- */
function jong(w){w=String(w||'');var c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return -1;return (c-0xAC00)%28}
function nm(n){return LANG==='ko'&&jong(n)>0?n+'이':n}             // 민준 → 민준이 (한국어만)
function voc(n){return LANG==='ko'?n+(jong(n)>0?'아':'야'):n}        // 민준아, 지우야
function fill(tpl,o){return josa(tpl.replace(/\{X\}/g,o.X||'').replace(/\{N\}/g,o.N).replace(/\{F\}/g,o.F).replace(/\{T\}/g,o.T).replace(/\{P\}/g,o.P).replace(/\{V\}/g,o.V))}

  if(!DR.end){var s=Math.floor((Date.now()-DR.start)/1000);tt.textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2);return}
  var left=Math.max(0,DR.end-Date.now()),s=Math.ceil(left/1000);tt.textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2);tc.setAttribute('stroke-dashoffset',String(603*(1-left/(DR.min*60e3))));

function scoreDraw(cv){var w=160,h=Math.round(cv.height*160/cv.width),c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.drawImage(cv,0,0,w,h);
  var d=x.getImageData(0,0,w,h).data,ink=0,hues=new Array(12).fill(0),edge=0,tot=w*h,L=new Float32Array(tot);
  for(var i=0,p=0;i<d.length;i+=4,p++){var r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,sat=mx===mn?0:(mx-mn)/(1-Math.abs(2*l-1));L[p]=l;
    if(l<.62||sat>.32){ink++;if(sat>.3&&l>.12&&l<.9){var hh;if(mx===r)hh=((g-b)/(mx-mn))%6;else if(mx===g)hh=(b-r)/(mx-mn)+2;else hh=(r-g)/(mx-mn)+4;hh=(hh*60+360)%360;hues[Math.floor(hh/30)]++}}}
  for(var yy=1;yy<h;yy++)for(var xx=1;xx<w;xx++){var q=yy*w+xx;if(Math.abs(L[q]-L[q-1])+Math.abs(L[q]-L[q-w])>.18)edge++}
  var cov=ink/tot,nc=hues.filter(function(v){return v>tot*.004}).length,det=edge/tot;
  var sCov=Math.min(14,Math.round(cov*40)),sCol=Math.min(14,nc*2+(nc>0?2:0)),sDet=Math.min(8,Math.round(det*60)),sTime=DR.min&&DR.used<=DR.min*60+5?4:2;
  var score=Math.max(60,Math.min(100,60+sCov+sCol+sDet+sTime)),stars=score>=95?5:score>=88?4:score>=78?3:2;
  var badges=[];if(nc>=5)badges.push('🌈 '+t('색깔 마법사'));else if(nc>=3)badges.push('🎨 '+t('색칠 솜씨왕'));if(cov>.28)badges.push('🖍️ '+t('꽉 찬 그림'));if(det>.09)badges.push('🔍 '+t('꼼꼼 화가'));if(DR.min&&DR.used<=DR.min*60)badges.push('⏰ '+t('시간 지킴이'));if(!badges.length)badges.push('✏️ '+t('멋진 시작'));

  return {score:score,stars:stars,badges:badges,msg:msg}}
