<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7ed957">
<title>All 바르게</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
window.PI_SESSION=null;
var PI_READY=(async function(){try{if(window.Pi)await Pi.init({version:"2.0"})}catch(e){}})();
window.piLogin=async function(){
  if(window.PI_SESSION)return window.PI_SESSION;
  try{await PI_READY;if(!window.Pi)return null;
    var a=await Pi.authenticate(["username","payments"],function(p){try{fetch("/pay/incomplete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:p.identifier,txid:p.transaction&&p.transaction.txid})})}catch(e){}});if(!a||!a.accessToken)return null;
    var un=a.user&&a.user.username,uid=a.user&&a.user.uid;
    try{var r=await fetch("/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:a.accessToken})});if(r.ok){var d=await r.json();if(d&&d.ok){un=d.username;uid=d.uid}}}catch(e){}
    window.PI_SESSION={token:a.accessToken,uid:uid,username:un};return window.PI_SESSION}catch(e){return null}};
</script>
<style>
:root{--g:#5cc93a;--g2:#e7f9dd;--y:#ffcf33;--y2:#fff6d4;--s:#4db8f5;--s2:#e3f4ff;--p:#ff7fa8;--p2:#ffe6ee;--ink:#2e3a2a;--mut:#7d8a76;--bg:#fffcf2;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}

button{font:inherit;cursor:pointer;border:0}
input,textarea,select{font:inherit}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 24px}

.logo{display:flex;align-items:center;gap:10px}

.logo h1{margin:0;font-size:25px;letter-spacing:-.5px}.logo h1 span{color:var(--g)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:var(--r);padding:16px 14px;text-align:left;min-height:150px;position:relative;overflow:hidden;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.07)}

.card.g{background:linear-gradient(160deg,#dff7d2,#bff0a8)}.card.p{background:linear-gradient(160deg,#ffe3ec,#ffc6d8)}

.btn{display:block;width:100%;padding:15px;border-radius:18px;font-weight:800;font-size:17px;color:#fff;background:var(--g);box-shadow:0 4px 0 #3e9a22;margin-top:10px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #3e9a22}
.btn.p{background:var(--p);box-shadow:0 4px 0 #e0567f}.btn.s{background:var(--s);box-shadow:0 4px 0 #2b8fcc}.btn.y{background:var(--y);color:#5a4300;box-shadow:0 4px 0 #e0a800}

.row{display:flex;gap:8px}.row>*{flex:1}

.chip.p.on{background:var(--p)}.chip.s.on{background:var(--s)}.chip.y.on{background:var(--y);color:#5a4300}
label.f{display:block;font-weight:800;font-size:14px;margin:12px 0 6px}

/* 도장판 */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 4px}

.topic{background:linear-gradient(160deg,#fff6d4,#ffe7a0);border-radius:24px;padding:22px 16px;text-align:center}
.topic .em{font-size:76px;line-height:1.1}.topic .cat{display:inline-block;background:#fff;border-radius:20px;padding:4px 12px;font-weight:800;font-size:13px;color:#a06b00}

.card.wide{display:flex;align-items:flex-end;width:100%;min-height:0;margin-bottom:12px;padding:14px 10px 0 14px;background:linear-gradient(160deg,#e3f4ff,#ffe3ec)}.card.wide .wl{flex:1;padding-bottom:14px}.card.wide img{height:112px;margin-left:-6px}
.pan .bbs{position:relative;z-index:2;display:flex;flex-direction:column;gap:9px;width:100%}.pan .who2{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;gap:2px;width:100%}.pan .who2 .ci{height:100%;max-height:150px;width:auto;object-fit:contain}.pan .who2 .ch{font-size:40px}

.gsay{position:absolute;left:10px;right:10px;top:10px;background:rgba(255,255,255,.92);border-radius:14px;padding:8px 12px;font-size:13.5px;font-weight:800;text-align:center}
.gcare{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.gcare button{background:#fff;border:2px solid #eef2ea;border-radius:16px;padding:10px 4px;font-weight:800;font-size:13px;color:var(--ink)}
.gcare span{display:block;font-size:30px}.gcare i,.gshop i{display:block;font-style:normal;font-size:11.5px;color:var(--mut);margin-top:2px}.gcare .dn{background:var(--g2);border-color:#c9f0b6}
.gcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.gcal i{font-style:normal;text-align:center;font-size:12.5px;padding:6px 0;border-radius:10px;background:#f6f8f3;color:#8a9585;font-weight:700;min-height:28px}.gcal i:empty{background:none}.gcal i.on{background:var(--y2);font-size:15px}.gcal i.td{outline:2px solid var(--g)}
.gshop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gshop>*{background:#fff;border:2px solid #eef2ea;border-radius:16px;padding:10px 4px;font-weight:800;font-size:12.5px;color:var(--ink);text-align:center}
.gshop span{display:block;font-size:30px}.gshop .on{background:var(--g2);border-color:var(--g)}.gshop .own{background:#fafbf8}
.gpay{background:linear-gradient(160deg,#f4edff,#fff)}.gpay .gshop{grid-template-columns:repeat(2,1fr)}.gpay i{color:#7b4bd8!important;font-weight:900;font-size:13px!important}
.cv-skip{display:block;margin-top:12px;color:#7d8a76;font-weight:700;font-size:13.5px;text-decoration:underline}
</style>

ST_OPEN:['Once upon a time, {N} lived in {P}. {N} had the brightest laugh you ever heard.','The sun was smiling one morning. In {P}, {N} stretched big and looked out the window.','In {P} lived a very special child — curious, sparkly {N}.','One sunny day, {N} held Mom\'s hand and went on an outing to {P}.'],
ST_MEET:['Then a tiny sound came from the bushes. "Hi! I\'m {F} the {T}!" {N} was surprised, but soon waved hello.','As {N} walked along, someone gently tapped {N}\'s shoulder. It was a cute {T} named {F}. "Will you be my friend?"','A sparkly light flashed, and there stood {F} the {T}. "{V}, I\'ve been waiting for you!"'],
ST_THEME:{
'Courage':['{F} said, "Over that hill grow rainbow berries. But there\'s a dark cave on the way, and I\'m scared to go alone."','{N} felt a little scared too. But {N} really wanted to help {F}. "It\'s okay — let\'s go together!"','The cave was very dark. {N} took a big breath and counted: one, two, three. Little by little, {N}\'s heart felt calm.','"When we\'re scared, let\'s sing!" {N} sang a happy song, and {F} sang along. The song bounced around the cave walls.','At last, a bright light shone at the end of the cave. Rainbow berries in seven colors hung everywhere.','"{V}, you are so brave!" said {F}. {N} smiled shyly, and learned that courage means taking one step even when you\'re scared.'],
'Friendship':['{N} and {F} played happily all day. But then they argued about who would ride the swing first.','"Me first!" "No, me first!" Their faces turned red, and they turned their backs on each other.','Sitting alone, {N}\'s heart felt achy. Swinging alone wasn\'t any fun at all.','{N} bravely walked over to {F}. "I\'m sorry about before. Let\'s take turns." {F} nodded. "I\'m sorry too."','They pushed each other on the swing. Every time they flew up high, giggles filled the air.','{N} kept it close in heart: "I\'m sorry" and "thank you" are magic words that bring friends back together.'],
'Sharing':['{N} took a yummy strawberry cookie out of the bag. But {F} was looking at it with a hungry face.','{N} thought for a moment — there were only two cookies. "Hmm… one is for you!"','{F}\'s eyes went round, and then came a big smile. "Thank you! Then I\'ll share half my apple with you."','Shared, the cookie and the apple tasted twice as good. Squirrels and birds gathered too, and a little picnic began.','When everyone shared a little, every tummy was full and every heart felt warmer.','{N} learned that sharing doesn\'t make things smaller — it makes joy bigger.'],
'Tidying up':['{F} came to play in {N}\'s room. But toys and books were scattered everywhere.','"Huh? Where did my blue block go?" {N} searched and searched but couldn\'t find it.','{F} said, "Let\'s play the tidy-up game! We find a home for every toy!"','Dolls to the basket house, books to the shelf house, blocks to the box house! They sang as they tidied, one by one.','When they finished, the blue block popped out from under the bed: "Here I am!" The room felt big and fresh.','{N} promised, "After playing, I\'ll help my toys find their homes!" The toys seemed to sparkle with joy.'],
'Healthy teeth':['After a yummy dinner, sleepy {N} said, "I\'ll skip brushing tonight and just go to bed…"','Just then {F} appeared with a tiny magnifying glass. "{V}, the cavity bugs are about to throw a party in your teeth!"','Through the glass, little bugs cheered, "Yum yum, no brushing tonight!" {N} was shocked.','{N} grabbed a toothbrush and brushed up and down, inside and out — scrub, scrub! The bugs ran away screaming.','Teeth sparkled white in the mirror. {F} gave a big thumbs-up. "Awesome! You\'re a strong-teeth knight!"','That night, {N} slept sweetly with a fresh mouth. Brushing every night is a great promise to keep your body safe.'],
'Bedtime':['It was late at night, but {N} couldn\'t fall asleep. The moon peeked in through the window.','Then {F} came with a soft cloud blanket. "{V}, want to go stargazing?"','They floated up into the sky on the cloud blanket. One by one, the stars twinkled hello.','The stars asked {N} to share one good thing from the day. {N} told them about helping a friend.','The stars clapped, and sparkly dust drifted down and gently closed {N}\'s eyes.','Soon {N} was fast asleep under a cozy blanket. {F} whispered, "Good night. See you tomorrow."']
},

['{N} ने स्वादिष्ट स्ट्रॉबेरी बिस्कुट निकाला। पर {F} भूखी नज़रों से उसे देख रहा था।','{N} ने थोड़ा सोचा — बस दो ही बिस्कुट हैं। “हम्म… एक तुम्हारे लिए!”','{F} की आँखें बड़ी हो गईं और वह मुस्कुरा उठा। “धन्यवाद! यह लो आधा सेब तुम्हारे लिए।”','साथ बाँटकर खाने से बिस्कुट और सेब दुगने स्वादिष्ट लगे। गिलहरी और चिड़िया भी आ गईं, छोटी पिकनिक शुरू हो गई।','सबने थोड़ा-थोड़ा बाँटा, सबका पेट भर गया और सबका दिल ख़ुश हो गया।','{N} ने सीखा: बाँटने से चीज़ें कम नहीं होतीं, ख़ुशी बढ़ जाती है।'],
['{F} {N} के कमरे में खेलने आया। पर खिलौने और किताबें हर जगह बिखरे थे।','“अरे? मेरा नीला ब्लॉक कहाँ गया?” {N} ने बहुत ढूँढा पर नहीं मिला।','{F} बोला, “चलो सफ़ाई का खेल खेलें! हर खिलौने का घर ढूँढते हैं!”','गुड़िया टोकरी-घर में, किताबें अलमारी-घर में, ब्लॉक डिब्बे-घर में! दोनों गाते हुए एक-एक करके सब सजाने लगे।','सफ़ाई होते ही नीला ब्लॉक पलंग के नीचे से लुढ़ककर आया: “मैं यहाँ हूँ!” कमरा खुला-खुला हो गया।','{N} ने वादा किया, “खेलने के बाद खिलौनों को उनके घर पहुँचाऊँगा!” खिलौने भी ख़ुशी से चमक उठे।'],
['खाने के बाद नींद में {N} बोला, “आज दाँत साफ़ नहीं करूँगा, सीधा सो जाऊँगा…”','तभी {F} एक छोटा आवर्धक काँच लेकर आया। “{V}, दाँतों के कीटाणु तुम्हारे दाँतों में दावत करने वाले हैं!”','काँच से देखा तो छोटे कीटाणु चिल्ला रहे थे, “यम-यम, आज ब्रश नहीं!” {N} चौंक गया।','{N} ने ब्रश उठाया, ऊपर-नीचे, अंदर-बाहर — घिस-घिस! कीटाणु चीखते हुए भाग गए।','आईने में दाँत चमक रहे थे। {F} ने अँगूठा दिखाया, “वाह! तुम स्वस्थ दाँतों के योद्धा हो!”','उस रात {N} ताज़ी साँस के साथ चैन से सोया। रोज़ रात ब्रश करना अपने शरीर की रक्षा का वादा है।'],
['रात हो गई थी पर {N} को नींद नहीं आ रही थी। चाँद खिड़की से धीरे से झाँक रहा था।','तभी {F} मुलायम बादलों का कंबल लेकर आया। “{V}, चलो तारे देखने चलें?”','दोनों बादल-कंबल पर बैठकर आसमान में उड़े। तारे टिमटिमाकर उनका स्वागत कर रहे थे।','तारे आज की एक अच्छी बात सुनना चाहते थे। {N} ने एक दोस्त की मदद करने की बात बताई।','तारों ने तालियाँ बजाईं और चमकीली तारों की धूल धीरे से {N} की आँखों पर गिरी।','जल्द ही {N} गर्म कंबल में गहरी नींद सो गया। {F} ने फुसफुसाया, “शुभ रात्रि, कल मिलेंगे।”']
],

/* ---------- 언어: 한국어가 기본, 다른 언어는 TR(화면 글자)과 CT(콘텐츠)에서 찾아요 ---------- */
var LNAME={ko:'한국어',en:'English',ja:'日本語',zh:'中文',vi:'Tiếng Việt',id:'Bahasa Indonesia',hi:'हिन्दी',es:'Español',fr:'Français',de:'Deutsch',pt:'Português',it:'Italiano',tr:'Türkçe',ru:'Русский',th:'ไทย',ar:'العربية',el:'Ελληνικά'};
var LANGS={ko:'한국어'};Object.keys(LNAME).forEach(function(k){if(window.TR&&TR[k]&&window.CT&&CT[k])LANGS[k]=LNAME[k]});
var LANG=(function(){var q='';try{q=new URLSearchParams(location.search).get('lang')||''}catch(e){}var s=ls('lang');var n=(navigator.language||'').slice(0,2);
  if(LANGS[q])return q;if(LANGS[s])return s;return n==='ko'?'ko':(LANGS[n]?n:'en')})();
document.documentElement.lang=LANG;
function josa(s){if(LANG!=='ko')return s;return s.replace(/(\S)\[([^\]\/]+)\/([^\]]+)\]/g,function(m,ch,a,b){var j=jong(ch);if(a==='으로')return ch+((j>0&&j!==8)?a:b);return ch+(j>0?a:b)})}
function t(k){var a=arguments,d=LANG!=='ko'&&window.TR&&TR[LANG],s=d&&(k in d)?d[k]:k;return josa(s.replace(/\{(\d)\}/g,function(m,i){return a[+i+1]}))}
function C(name){return (LANG!=='ko'&&window.CT&&CT[LANG]&&CT[LANG][name])||window[name]}
function setLang(l){LANG=l;ls('lang',l);document.documentElement.lang=l;STORY=null;MQ=null;DR.topic=null;render()}
function langSel(){return '<select class="lsel" onchange="setLang(this.value)" aria-label="language">'+Object.keys(LANGS).map(function(k){return '<option value="'+k+'"'+(k===LANG?' selected':'')+'>'+LANGS[k]+'</option>'}).join('')+'</select>'}

/* ---------- 한국어 조사 ---------- */
function jong(w){w=String(w||'');var c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return -1;return (c-0xAC00)%28}
function nm(n){return LANG==='ko'&&jong(n)>0?n+'이':n}             // 민준 → 민준이 (한국어만)
function voc(n){return LANG==='ko'?n+(jong(n)>0?'아':'야'):n}        // 민준아, 지우야
function fill(tpl,o){return josa(tpl.replace(/\{N\}/g,o.N).replace(/\{F\}/g,o.F).replace(/\{T\}/g,o.T).replace(/\{P\}/g,o.P).replace(/\{V\}/g,o.V))}

  '<div class="box"><h2>'+t('오늘 지킨 약속을 눌러요')+'</h2>'+s.missions.map(function(m,i){var c=s.stamps.filter(function(x){return x.m===m}).length;return '<button class="mbtn" onclick="stamp('+i+')">'+esc(m)+'<small>'+t('{0}번',c)+' ✓</small></button>'}).join('')+

  for(var i=0,p=0;i<d.length;i+=4,p++){var r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,sat=mx===mn?0:(mx-mn)/(1-Math.abs(2*l-1));L[p]=l;
    if(l<.62||sat>.32){ink++;if(sat>.3&&l>.12&&l<.9){var hh;if(mx===r)hh=((g-b)/(mx-mn))%6;else if(mx===g)hh=(b-r)/(mx-mn)+2;else hh=(r-g)/(mx-mn)+4;hh=(hh*60+360)%360;hues[Math.floor(hh/30)]++}}}
  for(var yy=1;yy<h;yy++)for(var xx=1;xx<w;xx++){var q=yy*w+xx;if(Math.abs(L[q]-L[q-1])+Math.abs(L[q]-L[q-w])>.18)edge++}
  var cov=ink/tot,nc=hues.filter(function(v){return v>tot*.004}).length,det=edge/tot;
  var sCov=Math.min(14,Math.round(cov*40)),sCol=Math.min(14,nc*2+(nc>0?2:0)),sDet=Math.min(8,Math.round(det*60)),sTime=DR.min&&DR.used<=DR.min*60+5?4:2;

  var V=voc(KID.name),msg=nc>=4?t('{0}, 알록달록 색깔이 정말 예뻐요! 보는 사람 마음까지 환해져요.',V):cov>.28?t('{0}, 종이를 가득 채운 그림이 정말 힘차요! 상상력이 대단해요.',V):det>.09?t('{0}, 선 하나하나 꼼꼼하게 그렸네요! 관찰력이 최고예요.',V):t('{0}, 멋지게 그렸어요! 다음엔 좋아하는 색을 더 칠해 볼까요?',V);

function api(u,d){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d||{})}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})}
var _cdT=null,_pulling=false;
function cloudDirty(){if(_pulling||!piTok())return;try{localStorage.setItem('ab_t',JSON.stringify(Date.now()))}catch(e){}clearTimeout(_cdT);_cdT=setTimeout(cloudPush,1500)}
function cloudPush(){var tk=piTok();if(!tk)return;var d={_t:ls('t')||Date.now()};SYNC_KEYS.forEach(function(k){var v=ls(k);if(v!==null)d[k]=v});api('/me',{token:tk,data:d})}
async function cloudPull(){var tk=piTok();if(!tk)return;var r=await api('/me',{token:tk});
  if(r&&r.ok&&r.data&&(r.data._t||0)>(ls('t')||0)){_pulling=true;SYNC_KEYS.forEach(function(k){if(k in r.data)ls(k,r.data[k])});ls('t',r.data._t);_pulling=false;
    KID=ls('kid')||KID;SB=ls('sb')||SB;GR=ls('grow')||GR}
  await claim();if(!(r&&r.data))cloudPush()}
async function claim(){var tk=piTok();if(!tk)return;var g=await api('/claim',{token:tk});if(!g||!g.ok)return;var ch=false;
  if(g.tok>0){if(GR){GR.tok+=g.tok;grSave()}else ls('gtok',(ls('gtok')||0)+g.tok);ch=true;toast('☀️ '+GU(33,g.tok))}
  if(g.prem&&!ls('gprem')){ls('gprem',1);ch=true}if(g.deco&&!ls('gdeco')){ls('gdeco',1);ch=true}
  if(ch){clearTimeout(_cdT);cloudPush();render()}}
document.addEventListener('visibilitychange',function(){if(document.hidden&&_cdT){clearTimeout(_cdT);_cdT=null;cloudPush()}});
function withTimeout(p,ms){return Promise.race([p,new Promise(function(r){setTimeout(function(){r(null)},ms)})])}
var _logging=false;
async function piStart(){if(_logging)return;_logging=true;var b=$('#piStart');if(b){b.disabled=true;b.textContent=LU(12)}
  try{var inPi=/PiBrowser/i.test(navigator.userAgent)||window.top!==window.self;var s=(inPi&&window.piLogin)?await withTimeout(window.piLogin(),12000):null;if(s){api('/ev',{token:s.token,e:'login'});await cloudPull()}}catch(e){}
  _logging=false;go(KID?'home':'kid')}
function acctLine(){var s=window.PI_SESSION;return s&&s.username?'<p class="mut" style="text-align:center;margin:8px 0 0">'+esc(LU(14,s.username))+'</p>':''}
/* 실제 Pi 결제 (부모님 확인 뒤) */
payPi=function(i){var it=PAY[i];gate(async function(){
  if(!window.Pi){toast('π '+GU(54));return}
  if(!piTok()){await withTimeout(window.piLogin(),12000);if(!piTok()){toast('π '+GU(54));return}await cloudPull()}
  var tk=piTok();
  try{Pi.createPayment({amount:it.pi,memo:'All Bareuge: '+it.id,metadata:{item:it.id}},{
    onReadyForServerApproval:function(id){api('/pay/approve',{token:tk,paymentId:id})},
    onReadyForServerCompletion:function(id,tx){api('/pay/complete',{token:tk,paymentId:id,txid:tx}).then(function(r){if(r&&r.ok){claim().then(function(){confetti(40);toast(it.e+' '+GU(59))})}else toast(LU(15))})},
    onCancel:function(){toast(LU(16))},onError:function(){toast(LU(15))}})}catch(e){toast(LU(15))}})};
/* 출석은 통계에 세기 */
(function(){var c=window.checkIn;window.checkIn=function(){var had=GR&&GR.ck&&GR.ck[today()];var r=c.apply(this,arguments);if(!had&&piTok())api('/ev',{token:piTok(),e:'ck'});return r}})();
/* 방문 기기 수 (이름 없음) */
(function(){try{var d=ls('dev');if(!d){d=Math.random().toString(36).slice(2,12);ls('dev',d)}fetch('/hit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({d:d,l:LANG})}).catch(function(){})}catch(e){}})();
render();
</script>
