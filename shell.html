<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7ed957">
<title>All 바르게</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
window.PI_SESSION=null;
var PI_READY=(async function(){try{if(window.Pi)await Pi.init({version:"2.0"})}catch(e){}})();
window.piLogin=async function(){
  if(window.PI_SESSION)return window.PI_SESSION;
  try{await PI_READY;if(!window.Pi)return null;
    var a=await Pi.authenticate(["username","payments"],function(p){try{fetch("/pay/incomplete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:p.identifier,txid:p.transaction&&p.transaction.txid})})}catch(e){}});if(!a||!a.accessToken)return null;
    var un=a.user&&a.user.username,uid=a.user&&a.user.uid;
    try{var r=await fetch("/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:a.accessToken})});if(r.ok){var d=await r.json();if(d&&d.ok){un=d.username;uid=d.uid}}}catch(e){}
    window.PI_SESSION={token:a.accessToken,uid:uid,username:un};return window.PI_SESSION}catch(e){return null}};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--g:#5cc93a;--g2:#e7f9dd;--y:#ffcf33;--y2:#fff6d4;--s:#4db8f5;--s2:#e3f4ff;--p:#ff7fa8;--p2:#ffe6ee;--ink:#2e3a2a;--mut:#7d8a76;--bg:#fffcf2;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
body{min-height:100vh;padding-bottom:30px}
button{font:inherit;cursor:pointer;border:0}
input,textarea,select{font:inherit}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 24px}
.top{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.top .back{white-space:nowrap;flex:0 0 auto;background:#fff;border-radius:14px;padding:8px 12px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.top b{font-size:19px;line-height:1.3}
.logo{display:flex;align-items:center;gap:10px}
.logo .lg{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#8fe36d,#ffe066);display:grid;place-items:center;font-size:30px;box-shadow:0 4px 0 rgba(92,201,58,.35)}
.logo h1{margin:0;font-size:25px;letter-spacing:-.5px}.logo h1 span{color:var(--g)}
.logo small{display:block;color:var(--mut);font-size:13px;font-weight:600}
.kid{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r);padding:14px;margin:12px 0 16px;box-shadow:0 3px 0 rgba(0,0,0,.05)}
.kid .av{width:54px;height:54px;border-radius:50%;background:var(--y2);display:grid;place-items:center;font-size:32px}
.kid .nm{font-size:19px;font-weight:800}.kid .sub{color:var(--mut);font-size:13px}
.kid .ed{margin-left:auto;background:var(--g2);color:#3a8f20;border-radius:12px;padding:8px 11px;font-weight:700;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:var(--r);padding:16px 14px;text-align:left;min-height:150px;position:relative;overflow:hidden;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.07)}
.card .ic{font-size:40px;line-height:1}.card h3{margin:10px 0 4px;font-size:18px}.card p{margin:0;font-size:12.5px;color:#556}
.card.g{background:linear-gradient(160deg,#dff7d2,#bff0a8)}.card.p{background:linear-gradient(160deg,#ffe3ec,#ffc6d8)}
.card.s{background:linear-gradient(160deg,#dff1ff,#b9e2ff)}.card.y{background:linear-gradient(160deg,#fff3c4,#ffe27f)}
.card .bdg{position:absolute;right:10px;top:10px;background:#fff;border-radius:20px;padding:3px 9px;font-size:11.5px;font-weight:800}
.box{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 3px 0 rgba(0,0,0,.05)}
.box h2{margin:0 0 10px;font-size:18px}
.btn{display:block;width:100%;padding:15px;border-radius:18px;font-weight:800;font-size:17px;color:#fff;background:var(--g);box-shadow:0 4px 0 #3e9a22;margin-top:10px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #3e9a22}
.btn.p{background:var(--p);box-shadow:0 4px 0 #e0567f}.btn.s{background:var(--s);box-shadow:0 4px 0 #2b8fcc}.btn.y{background:var(--y);color:#5a4300;box-shadow:0 4px 0 #e0a800}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.08);border:2px solid #eee}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
img.kphoto{width:1.6em;height:1.6em;border-radius:50%;object-fit:cover;vertical-align:middle;display:inline-block}.kid .av{overflow:hidden}.kid .av img.kphoto{width:100%;height:100%}.who img.kphoto{width:1.2em;height:1.2em}
.kph{display:flex;gap:8px;align-items:center;margin-top:10px}.kph .btn{margin:0;padding:12px;font-size:14px}.kpc{padding:6px 10px!important;font-size:24px}.kdel{background:none;border:0;color:var(--mut);font-size:12px;text-decoration:underline;white-space:nowrap}
#kav{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}#kav .chip{width:100%;padding:10px 0}
.chip{background:#f3f5f0;border-radius:20px;padding:8px 12px;font-weight:700;font-size:14px}
.chip.on{background:var(--g);color:#fff}
.chip.p.on{background:var(--p)}.chip.s.on{background:var(--s)}.chip.y.on{background:var(--y);color:#5a4300}
label.f{display:block;font-weight:800;font-size:14px;margin:12px 0 6px}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:2px solid #e8ece4;background:#fbfcfa;font-size:16px}
.inp:focus{outline:0;border-color:var(--g)}
.mut{color:var(--mut);font-size:13px}
/* 도장판 */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 4px}
.cell{aspect-ratio:1;border-radius:50%;border:3px dashed #d8e6cf;display:grid;place-items:center;font-size:12px;color:#b5c4ab;font-weight:800;background:#fbfff8;position:relative}
.cell.on{border:0;background:radial-gradient(circle at 35% 30%,#ff8a8a,#e8364b);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.1);transform:rotate(-8deg)}
.cell.on span{font-size:24px;line-height:1}.cell.on i{position:absolute;bottom:4px;font-style:normal;font-size:8px;opacity:.9}
.cell.pop{animation:pop .5s}

.mbtn{display:flex;align-items:center;gap:10px;width:100%;background:var(--g2);border-radius:16px;padding:12px 14px;margin-top:8px;font-weight:800;font-size:16px;color:#2f6e1a;text-align:left}
.mbtn small{margin-left:auto;font-size:12px;color:#5d8f48;font-weight:700}
.promise{background:var(--y2);border-radius:16px;padding:12px 14px;margin-top:10px;font-size:14px}

.prog{height:12px;background:#eef3ea;border-radius:10px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#8fe36d,#ffcf33);border-radius:10px}
/* 동화 */
.scene{border-radius:20px;height:190px;position:relative;overflow:hidden;margin-bottom:12px;display:flex;align-items:flex-end;justify-content:center;gap:16px;padding-bottom:22px}

.scene .who{font-size:62px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.scene .who:nth-child(3){animation-delay:.6s}

.story p{font-size:18px;line-height:1.85;margin:0 0 14px;word-break:keep-all}
.pager{display:flex;align-items:center;gap:10px;margin-top:6px}.pager span{font-weight:800;color:var(--mut);min-width:60px;text-align:center}
/* 웹툰 */
.toon{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fff;padding:8px;border-radius:18px;border:3px solid #2e3a2a}
.pan{aspect-ratio:4/5;border-radius:10px;border:2.5px solid #2e3a2a;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:16px 6px 6px}

.pan .ch{font-size:44px;line-height:1}.pan .pr{position:absolute;right:6px;bottom:6px;font-size:30px;z-index:1}
.pan .scn{position:absolute;left:0;right:0;bottom:26%;text-align:center;font-size:64px;line-height:1;opacity:.3;letter-spacing:2px;white-space:nowrap;z-index:0}
.pan .bb{position:relative;background:#fff;border:2px solid #2e3a2a;border-radius:14px;padding:6px 9px;font-size:15px;font-weight:800;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.pan .bb:after{content:"";position:absolute;bottom:-8px;left:22px;border:6px solid transparent;border-top-color:#2e3a2a}

.tlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tlist button{background:#fff;border-radius:14px;padding:10px;text-align:left;font-weight:700;font-size:13.5px;box-shadow:0 2px 0 rgba(0,0,0,.05)}
.tlist button.on{background:var(--s2);outline:2px solid var(--s)}
/* 그림 퀴즈 */
.topic{background:linear-gradient(160deg,#fff6d4,#ffe7a0);border-radius:24px;padding:22px 16px;text-align:center}
.topic .em{font-size:76px;line-height:1.1}.topic .cat{display:inline-block;background:#fff;border-radius:20px;padding:4px 12px;font-weight:800;font-size:13px;color:#a06b00}
.topic h2{margin:10px 0 0;font-size:22px;word-break:keep-all}
.topic .tri{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:10px}

.topic .tri b{display:block;font-size:15px;margin-top:4px;word-break:keep-all}
.topic .tri .pl{font-size:22px;font-weight:900;color:#a06b00}
.topic.sm .tri .em{font-size:38px}.topic.sm .tri b{font-size:13px}
.timer{position:relative;width:220px;height:220px;margin:10px auto}
.timer svg{transform:rotate(-90deg)}.timer .t{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;font-weight:900}
.shot{position:relative;border-radius:18px;overflow:hidden;background:#000}
.shot img{display:block;width:100%}
.shot .line{position:absolute;left:0;right:0;height:5px;background:linear-gradient(90deg,transparent,#5cc93a,#b8ff9a,#5cc93a,transparent);box-shadow:0 0 18px 6px rgba(92,201,58,.7);top:0;animation:scan 2.2s linear infinite}
@keyframes scan{0%{top:0}100%{top:100%}}
.score{text-align:center}.score .n{font-size:68px;font-weight:900;color:var(--p);line-height:1}
.stars{font-size:30px;letter-spacing:2px}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}.badges span{background:var(--p2);border-radius:16px;padding:6px 11px;font-weight:800;font-size:13px}
/* 모달·토스트 */
.mask{position:fixed;inset:0;background:rgba(30,40,25,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 16px 28px;max-height:88vh;overflow:auto;animation:up .25s}

.sheet h2{margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2e3a2a;color:#fff;padding:11px 18px;border-radius:20px;font-weight:700;z-index:90;font-size:14px;max-width:90vw;text-align:center}
.cert img{width:100%;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.conf{position:fixed;top:-20px;font-size:24px;z-index:80;animation:fall linear forwards;pointer-events:none}

.lg2{display:flex;align-items:flex-end;gap:0;width:76px;height:56px;position:relative}.lg2 img{width:44px;height:44px;object-fit:cover;object-position:top;border-radius:50%;background:#ffe066;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.08)}.lg2 img+img{margin-left:-12px;background:#ffd1e0}
.greet{display:flex;align-items:flex-end;gap:6px;background:linear-gradient(160deg,#fff6d4,#ffe3ec);border-radius:var(--r);padding:10px 8px 0;margin:10px 0 14px;overflow:hidden}
.greet img{height:118px;flex:0 0 auto}.greet .gb{flex:1;background:#fff;border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.55;margin-bottom:12px;word-break:keep-all;box-shadow:0 2px 0 rgba(0,0,0,.05)}

.card.wide{display:flex;align-items:flex-end;width:100%;min-height:0;margin-bottom:12px;padding:14px 10px 0 14px;background:linear-gradient(160deg,#e3f4ff,#ffe3ec)}.card.wide .wl{flex:1;padding-bottom:14px}.card.wide img{height:112px;margin-left:-6px}
.pan .bbs{position:relative;z-index:2;display:flex;flex-direction:column;gap:9px;width:100%}.pan .who2{position:relative;z-index:1;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;gap:2px;width:100%}.pan .who2 .ci{height:100%;max-height:150px;width:auto;object-fit:contain}.pan .who2 .ch{font-size:46px}

.praise{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:6px;z-index:95;animation:up .25s;pointer-events:none}.praise img{height:150px}.praise .pb{background:#fff;border:3px solid #ff7fa8;border-radius:18px;padding:10px 14px;font-weight:900;font-size:17px;margin-bottom:60px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.12)}.praise.out{opacity:0;transition:opacity .4s}
.mscene{background:linear-gradient(160deg,#e3f4ff,#e9fbe0);border-radius:24px;padding:18px 16px;text-align:center;margin-bottom:12px}.mscene .pl{display:inline-block;background:#fff;border-radius:20px;padding:4px 12px;font-weight:800;font-size:13px;color:#1d78b0}.mscene .pe{font-size:72px;line-height:1.15}.mscene h2{margin:6px 0 0;font-size:21px;word-break:keep-all}
.opt{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border-radius:18px;padding:16px;margin-bottom:10px;font-weight:800;font-size:17px;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.07);border:3px solid #eef2ea}.opt span{font-size:34px}
.react{display:flex;align-items:flex-end;gap:8px;border-radius:20px;padding:12px 10px 0;margin-bottom:6px;overflow:hidden}.react.ok{background:#e9fbe0}.react.no{background:#ffe8ef}.react img{height:140px}.react div{padding-bottom:12px;font-size:14.5px;line-height:1.55;word-break:keep-all}.react b{font-size:17px}.react p{margin:4px 0 0}
.lsel{border:2px solid #e3ead9;background:#fff;border-radius:12px;padding:6px 8px;font-weight:700;font-size:13px;color:#2e3a2a}
#printArea{display:none}

.cv-top{position:relative;z-index:2;align-self:flex-end}

.gp.lk span{filter:grayscale(.6);opacity:.7}.gp em{position:absolute;top:6px;right:6px;font-style:normal;background:#7b4bd8;color:#fff;font-size:11px;font-weight:800;border-radius:10px;padding:2px 7px}
